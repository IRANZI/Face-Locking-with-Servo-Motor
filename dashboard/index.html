<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Tracking Dashboard — elvin01</title>
    <style>
        /* ─── Reset & Base ────────────────────────── */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f5f6fa;
            color: #2f3640;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ─── Header ─────────────────────────────── */
        header {
            width: 100%;
            background: linear-gradient(135deg, #4b79a1 0%, #283e51 100%);
            padding: 20px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            border-radius: 0 0 12px 12px;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .conn-badge {
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .connected {
            background: #27ae60;
            color: #fff;
        }

        .disconnected {
            background: #e84118;
            color: #fff;
        }

        .connecting {
            background: #f39c12;
            color: #fff;
        }

        /* ─── Grid ───────────────────────────────── */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            width: 95%;
            max-width: 900px;
            margin-top: 30px;
        }

        /* ─── Card ───────────────────────────────── */
        .card {
            background: #fff;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
        }

        .card h2 {
            font-size: 0.85rem;
            color: #718093;
            letter-spacing: 0.05em;
            margin-bottom: 10px;
        }

        .card .value {
            font-size: 2rem;
            font-weight: 700;
            color: #2f3640;
        }

        .status-MOVE_LEFT {
            color: #e1b12c;
        }

        .status-MOVE_RIGHT {
            color: #0097e6;
        }

        .status-CENTERED {
            color: #44bd32;
        }

        .status-NO_FACE {
            color: #718093;
        }

        /* ─── Servo Visual ───────────────────────── */
        .servo-vis {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px;
        }

        .arrow-bar {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 16px;
        }

        .arrow {
            font-size: 2.4rem;
            opacity: 0.3;
            transition: all 0.2s;
        }

        .arrow.active {
            opacity: 1;
            transform: scale(1.2);
        }

        .face-icon {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #dcdde1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.3s;
        }

        .face-icon.locked {
            box-shadow: 0 0 0 3px #44bd32, 0 0 16px rgba(68, 189, 50, 0.25);
        }

        /* ─── Log ────────────────────────────────── */
        .log-card {
            grid-column: 1 / -1;
        }

        #log {
            height: 180px;
            overflow-y: auto;
            font-family: 'Fira Code', monospace;
            font-size: 0.82rem;
            background: #f1f2f6;
            border-radius: 10px;
            padding: 10px;
            color: #2f3640;
        }

        #log .entry .ts {
            color: #7f8fa6;
            margin-right: 6px;
        }

        /* ─── Footer ─────────────────────────────── */
        footer {
            margin-top: 30px;
            padding: 12px;
            font-size: 0.78rem;
            color: #718093;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>🎯 Face Tracking Dashboard</h1>
        <span id="connBadge" class="conn-badge connecting">Connecting…</span>
    </header>

    <!-- Cards Grid -->
    <div class="grid">
        <div class="card">
            <h2>Movement</h2>
            <div id="statusValue" class="value status-NO_FACE">—</div>
        </div>

        <div class="card">
            <h2>Confidence</h2>
            <div id="confValue" class="value">—</div>
        </div>

        <div class="card servo-vis">
            <h2>Servo Direction</h2>
            <div class="arrow-bar">
                <span id="arrowLeft" class="arrow">◀</span>
                <div id="faceIcon" class="face-icon">👤</div>
                <span id="arrowRight" class="arrow">▶</span>
            </div>
        </div>

        <div class="card">
            <h2>Last Update</h2>
            <div id="tsValue" class="value">—</div>
        </div>

        <div class="card">
            <h2>Messages</h2>
            <div id="msgCount" class="value">0</div>
        </div>

        <div class="card log-card">
            <h2>Event Log</h2>
            <div id="log"></div>
        </div>
    </div>

    <footer>Team elvin01 · Phase 1 · WebSocket ws://127.0.0.1:9002</footer>

    <script>
        // ─── Configuration ─────────────────────────
        const WS_URL = "ws://127.0.0.1:9002";
        const MAX_LOG = 80;

        // ─── DOM refs ──────────────────────────────
        const $badge = document.getElementById("connBadge");
        const $status = document.getElementById("statusValue");
        const $conf = document.getElementById("confValue");
        const $ts = document.getElementById("tsValue");
        const $count = document.getElementById("msgCount");
        const $log = document.getElementById("log");
        const $arrowL = document.getElementById("arrowLeft");
        const $arrowR = document.getElementById("arrowRight");
        const $face = document.getElementById("faceIcon");

        let messageCount = 0;
        let ws = null;

        // ─── WebSocket Logic ───────────────────────
        function connect() {
            $badge.className = "conn-badge connecting";
            $badge.textContent = "Connecting…";

            ws = new WebSocket(WS_URL);

            ws.onopen = () => {
                $badge.className = "conn-badge connected";
                $badge.textContent = "Connected";
                addLog("WebSocket connected to " + WS_URL);
            };

            ws.onmessage = (evt) => {
                try {
                    const data = JSON.parse(evt.data);
                    handleMessage(data);
                } catch (e) {
                    addLog("Bad message: " + evt.data);
                }
            };

            ws.onclose = () => {
                $badge.className = "conn-badge disconnected";
                $badge.textContent = "Disconnected";
                addLog("Connection lost — reconnecting in 3s…");
                setTimeout(connect, 3000);
            };

            ws.onerror = () => {
                addLog("WebSocket error");
            };
        }

        // ─── Handle Incoming Message ──────────────
        function handleMessage(data) {
            messageCount++;
            const status = data.status || "NO_FACE";
            const confidence = data.confidence || 0;
            const timestamp = data.timestamp || 0;

            // Update status display
            $status.textContent = status;
            $status.className = "value status-" + status;

            // Update confidence
            $conf.textContent = (confidence * 100).toFixed(1) + "%";

            // Update timestamp
            if (timestamp > 0) {
                const d = new Date(timestamp * 1000);
                $ts.textContent = d.toLocaleTimeString();
            }

            // Update count
            $count.textContent = messageCount;

            // Update arrows
            $arrowL.classList.toggle("active", status === "MOVE_LEFT");
            $arrowR.classList.toggle("active", status === "MOVE_RIGHT");
            $face.classList.toggle("locked", status !== "NO_FACE");

            // Log
            addLog(status + "  conf=" + confidence.toFixed(2));
        }

        // ─── Log Helper ───────────────────────────
        function addLog(text) {
            const now = new Date().toLocaleTimeString();
            const entry = document.createElement("div");
            entry.className = "entry";
            entry.innerHTML = '<span class="ts">' + now + '</span>' + text;
            $log.prepend(entry);
            while ($log.children.length > MAX_LOG) {
                $log.removeChild($log.lastChild);
            }
        }

        // ─── Start ─────────────────────────────────
        connect();
    </script>
</body>

</html>
